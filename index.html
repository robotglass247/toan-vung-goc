<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18624b"><meta name="description" content="Cài biểu tượng ứng dụng Toán Vững Gốc V4.7 TEST lên màn hình chính.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../icon-192.png"><title>Cài ứng dụng | Toán Vững Gốc 3–4–5</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f2f6fb;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#14365c;padding:22px}.card{width:min(100%,500px);background:#fff;border:1px solid #d9e5f1;border-radius:26px;box-shadow:0 18px 44px #25446619;padding:28px 24px;text-align:center}.logo{width:130px;height:130px;object-fit:cover;border-radius:28px;box-shadow:0 6px 14px #0b63c32b}.brand{font-size:clamp(21px,5vw,27px);font-weight:900;margin:22px 0 14px;color:#0c3c78;line-height:1.25}.sub{font-size:13px;color:#647c95;margin-top:-8px;margin-bottom:20px}.status{border:1px solid #d8e5f5;background:#f7fafc;border-radius:14px;padding:15px;text-align:left;font-size:14px;line-height:1.5;margin-bottom:15px;min-height:60px}.button{width:100%;min-height:58px;display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:15px;font-size:17px;font-weight:900;margin-top:11px;border:1px solid #1c6c4f;cursor:pointer}.primary{background:#1c6c4f;color:white}.secondary{background:#fff;color:#1c6c4f}.primary:disabled{opacity:.65;cursor:not-allowed}.instructions{display:none;text-align:left;font-size:14px;line-height:1.65;background:#f0f8f4;border:1px solid #cfe4d8;border-radius:15px;margin-top:15px;padding:13px 16px}.instructions.show{display:block}.instructions h2{font-size:15px;margin:0 0 6px}.instructions ol{padding-left:22px;margin:5px 0}.instructions li{margin-bottom:5px}.instructions strong{color:#0b5237}.foot{font-size:12px;color:#75859a;margin-top:18px}.smalllink{display:block;color:#155ab0;font-size:13px;margin-top:15px;overflow-wrap:anywhere}.button:focus-visible{outline:3px solid #eca800;outline-offset:3px}@media(max-width:420px){body{padding:12px}.card{padding:24px 17px;border-radius:19px}.logo{width:106px;height:106px}.button{min-height:54px;font-size:16px}}
</style></head>
<body><main class="card">
<img class="logo" src="../icon-512.png" alt="Biểu tượng Toán Vững Gốc">
<h1 class="brand">TOÁN VỮNG GỐC 3–4–5</h1>
<div class="sub">Học bù • Kiểm tra • Luyện tập — V4.7 TEST</div>
<div id="status" class="status" role="status" aria-live="polite">Đang kiểm tra khả năng cài ứng dụng trên thiết bị...</div>
<button class="button primary" id="install" type="button">CÀI ĐẶT ICON</button>
<a class="button secondary" id="open" href="../index.html">MỞ ỨNG DỤNG</a>
<section class="instructions" id="instructions" aria-live="polite"><h2>Hướng dẫn cài đặt</h2><div id="steps"></div></section>
<a class="smalllink" href="../../index.html">Mở trang chủ Toán Vững Gốc hiện tại</a>
<p class="foot">Trang cài đặt V4.7 TEST • Không thay đổi dữ liệu học sinh</p>
</main>
<script>
'use strict';
let deferredInstall=null;
const statusEl=document.getElementById('status');
const instructionEl=document.getElementById('instructions');
const stepsEl=document.getElementById('steps');
const installBtn=document.getElementById('install');
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
const isAndroid=/Android/i.test(navigator.userAgent);
const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function setStatus(message){statusEl.textContent=message;}
function showHelp(){
 let html;
 if(isIOS){html='<ol><li>Mở trang này bằng <strong>Safari</strong>.</li><li>Nhấn <strong>Chia sẻ</strong> (biểu tượng hình vuông có mũi tên lên).</li><li>Chọn <strong>Thêm vào Màn hình chính</strong>, sau đó nhấn <strong>Thêm</strong>.</li></ol>';}
 else if(isAndroid){html='<ol><li>Mở trang này bằng <strong>Chrome</strong>.</li><li>Nhấn dấu <strong>⋮</strong> ở góc Chrome.</li><li>Chọn <strong>Cài đặt ứng dụng</strong> hoặc <strong>Thêm vào màn hình chính</strong>.</li><li>Xác nhận cài đặt rồi mở biểu tượng Toán Vững Gốc.</li></ol>';}
 else {html='<ol><li>Mở trang này bằng <strong>Chrome</strong> hoặc <strong>Edge</strong>.</li><li>Nhấn biểu tượng <strong>Cài đặt</strong> trên thanh địa chỉ, nếu có.</li><li>Hoặc mở menu trình duyệt và chọn <strong>Cài đặt ứng dụng</strong>.</li></ol>';}
 stepsEl.innerHTML=html;
 instructionEl.classList.add('show');
}
if(isStandalone){setStatus('Ứng dụng đang chạy ở chế độ đã cài đặt. Bấm MỞ ỨNG DỤNG để bắt đầu.');installBtn.textContent='ĐÃ CÀI ĐẶT';installBtn.disabled=true;}
else{setStatus('Sẵn sàng cài đặt. Bấm CÀI ĐẶT ICON để thực hiện.');}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstall=event;if(!isStandalone)setStatus('Thiết bị hỗ trợ cài trực tiếp. Bấm CÀI ĐẶT ICON.');});
installBtn.addEventListener('click',async()=>{
 if(isStandalone)return;
 if(deferredInstall){
  const event=deferredInstall;deferredInstall=null;
  event.prompt();
  const outcome=await event.userChoice;
  if(outcome?.outcome==='accepted')setStatus('Đã chấp nhận yêu cầu cài đặt. Kiểm tra biểu tượng trên màn hình thiết bị.');
  else{setStatus('Chưa cài ứng dụng. Bạn có thể thử lại qua menu trình duyệt.');showHelp();}
 }else{showHelp();setStatus('Trình duyệt chưa cung cấp hộp thoại cài trực tiếp. Hãy làm theo hướng dẫn bên dưới.');}
});
window.addEventListener('appinstalled',()=>{setStatus('Ứng dụng đã cài đặt thành công!');installBtn.textContent='ĐÃ CÀI ĐẶT';installBtn.disabled=true;instructionEl.classList.remove('show');});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));}
</script></body></html>
